<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dan-tts Library</title>
  <style>
    :root { --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6b6b70; --card: #fff; --border: #e3e1dc; --accent: #4f46e5; --track: #ecebe6; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --fg: #ececf0; --muted: #9a9aa3; --card: #222227; --border: #34343b; --accent: #818cf8; --track: #2e2e35; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { font-size: 26px; margin: 0; }
    .hint { color: var(--muted); font-size: 14px; margin: 6px 0 24px; }
    kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; background: var(--card); }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    li { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
    a.title { color: var(--fg); font-weight: 600; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    a.title:hover { color: var(--accent); }
    .meta { color: var(--muted); font-size: 13px; grid-column: 1; }
    .track { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: 6px; }
    .fill { height: 100%; background: var(--accent); }
    button { font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
    button:hover { color: var(--fg); border-color: var(--border); }
    .remove { grid-column: 2; grid-row: 1 / 3; align-self: center; }
    .empty { color: var(--muted); text-align: center; padding: 48px 0; }
    .books { color: var(--accent); font-size: 14px; margin-right: 12px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Library</h1>
      <span>
        <a href="book.html" class="books">Find books</a>
        <button id="clear" hidden>Clear all</button>
      </span>
    </header>
    <p class="hint">Pages you've read with dan-tts. Open one and press <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> (or click the toolbar icon) to pick up where you left off.</p>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>Nothing here yet. Read a page and it will show up here.</p>
  </main>
  <script src="library.js"></script>
</body>
</html>
