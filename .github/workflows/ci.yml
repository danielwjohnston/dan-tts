name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/chunk-text.test.js tests/bundle.test.js
      - run: npm test
        working-directory: engine
      - run: node --test extension/test/align.test.js
      - run: node scripts/sync-extension.mjs --check
