name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test tests/chunk-text.test.js tests/bundle.test.js
      - run: npm test
        working-directory: engine
      - run: node --test extension/test/align.test.js extension/test/pdf-text.test.js
      - run: node scripts/sync-extension.mjs --check
      - run: node --check worker/src/index.js
      # Firefox build of the extension, downloadable from the run's Artifacts
      - run: node scripts/build-firefox.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: dan-tts-firefox
          path: dist/firefox/
          retention-days: 30

  # The extension in real browsers against the live voice service: Chromium (Playwright) and
  # Firefox (WebDriver BiDi via puppeteer-core). The runner image already has Firefox.
  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          npm install --no-save --prefix "$RUNNER_TEMP/e2e" playwright@1.56.1 puppeteer-core@25.14.0
          "$RUNNER_TEMP/e2e/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/e2e/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
          echo "PUPPETEER_MODULE=$RUNNER_TEMP/e2e/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js" >> "$GITHUB_ENV"
      - run: node extension/test/e2e.mjs
      - run: FIREFOX_PATH="$(readlink -f "$(command -v firefox)")" node extension/test/e2e-firefox.mjs
