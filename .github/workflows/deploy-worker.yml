name: Deploy Cloudflare Worker

# Deploys the dan-tts Worker (API in worker/ plus the static front end) from the root wrangler.jsonc. Needs two repository
# secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; see worker/README.md.
# Without them this workflow skips instead of failing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', 'engine/src/**', 'wrangler.jsonc', 'demo.html', 'tester.html', 'static/**', 'samples/**', '.github/workflows/deploy-worker.yml']

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see worker/README.md)."
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: cloudflare/wrangler-action@v4.1.3
        if: steps.creds.outputs.ok == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.2'
          command: deploy
