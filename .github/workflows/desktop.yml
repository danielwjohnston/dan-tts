name: Desktop app

# Builds the dan-tts Reader desktop app for Windows, macOS and Linux (unsigned) and runs its
# end-to-end test on Linux. Installers are attached to each run under "Artifacts".
# To publish a release: bump "version" in desktop/package.json, merge, then push a tag
# desktop-v<version> (e.g. git tag desktop-v0.2.0 && git push origin desktop-v0.2.0).
# The installers are then attached to a GitHub Release with a permanent download link.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['desktop-v*'] # path filters don't apply to tag pushes
    paths: ['desktop/**', 'extension/**', 'engine/src/**', 'scripts/sync-desktop.mjs', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'extension/**', 'engine/src/**', 'scripts/sync-desktop.mjs', '.github/workflows/desktop.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - run: npm install --no-save playwright@1.56.1
        working-directory: desktop
      # Ubuntu 24.04 restricts unprivileged user namespaces, which Electron's sandbox needs
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm test
        working-directory: desktop

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds
      - uses: actions/upload-artifact@v7
        with:
          name: dan-tts-reader-${{ runner.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      actions: read # download this run's installers
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the app version
        run: |
          version="desktop-v$(node -p "require('./desktop/package.json').version")"
          if [ "$version" != "$TAG" ]; then echo "::error::Tag $TAG doesn't match desktop/package.json ($version)"; exit 1; fi
      - run: gh run download "$GITHUB_RUN_ID" --dir installers --pattern 'dan-tts-reader-*'
      - name: Publish the release
        run: |
          gh release create "$TAG" installers/*/* --title "dan-tts Reader ${TAG#desktop-v}" --generate-notes --notes "Unsigned builds: see desktop/README.md for the first-run steps on Windows and macOS. Use a personal computer, not a work-managed one."
